[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-account-switcher"
version = "0.2.0"
description = "你是否厌倦了 Codex 多个账号之间来回切换？Local Codex account profiles, switching, and usage limits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Haoxiang Sun"}]
keywords = ["codex", "cli", "account", "usage", "openai"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/shx2005/codex-account-switcher"
Repository = "https://github.com/shx2005/codex-account-switcher"
Issues = "https://github.com/shx2005/codex-account-switcher/issues"

[project.scripts]
codex-account = "codex_account:main"

[tool.setuptools]
py-modules = ["codex_account", "native_codex"]
package-dir = {"" = "scripts"}
